<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>刘大皮</title>
<style>
:root{--bg:#0b0b0b;--card:#161616;--card2:#1f1f1f;--gold:#d4af37;--gl:#f5d77a;--gd:#b8892b;--grad:linear-gradient(135deg,#f5d77a 0%,#d4af37 50%,#b8892b 100%);--bd:1px solid rgba(212,175,55,.5);--t:#f2f2f2;--t2:#b5b5b5;--t3:#808080;--red:#ff5a4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--t);font:14px/1.45 -apple-system,"PingFang SC","Noto Sans CJK SC","Helvetica Neue",sans-serif}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.nav{height:46px;flex:none;background:#000;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #1d1d1d;padding-top:env(safe-area-inset-top)}
.nav .tt{font-size:17px;font-weight:600;color:var(--gl)}
.nav .back{position:absolute;left:8px;font-size:26px;color:var(--gl);padding:0 10px;cursor:pointer;line-height:46px}
.capsule{position:absolute;right:8px;width:87px;height:32px;border:1px solid #444;border-radius:16px;display:flex;align-items:center;justify-content:space-around;color:#ddd;font-size:15px;background:rgba(255,255,255,.04)}
.capsule i{width:1px;height:18px;background:#444}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.tabbar{flex:none;height:56px;background:#111;border-top:1px solid #222;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8c8c8c;font-size:11px;cursor:pointer}
.tab svg{width:24px;height:24px;margin-bottom:2px;fill:#8c8c8c}
.tab.on{color:var(--gold)}.tab.on svg{fill:var(--gold)}
.header{background:linear-gradient(180deg,#000 0%,#1a1405 100%);padding:16px 15px 20px;border-bottom:var(--bd)}
.brand{font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.slogan{color:var(--t2);font-size:13px;margin-top:5px}
.wallet{margin-top:15px;background:var(--card);border:var(--bd);border-radius:10px;padding:13px;display:flex;align-items:center}
.wallet .n{font-size:24px;font-weight:700;color:var(--gl);margin-left:12px;flex:1}
.card{background:var(--card);border:var(--bd);border-radius:10px;margin:12px;padding:14px}
.ct{font-size:17px;font-weight:700;color:var(--gl)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.more{color:var(--t3);font-size:13px;cursor:pointer}
.muted{color:var(--t3);font-size:12px}.sub{color:var(--t2);font-size:13px}.goldt{color:var(--gold)}.red{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #262626;cursor:pointer}.row:last-child{border-bottom:none}
.arrow{color:var(--t3);font-size:18px}
.btn{display:inline-block;border:none;cursor:pointer;font:inherit;border-radius:999px;padding:9px 18px;text-align:center}
.btn-gold{background:var(--grad);color:#1a1200;font-weight:700}
.btn-ghost{background:transparent;color:var(--gold);border:var(--bd)}
.btn.block{display:block;width:100%;padding:12px;font-size:16px;margin-top:12px}
.btn.mini{padding:5px 12px;font-size:13px}
.pill{display:inline-block;background:var(--grad);color:#1a1200;font-weight:700;border-radius:999px;padding:4px 13px;font-size:13px}
.tag{display:inline-block;background:rgba(212,175,55,.15);color:var(--gold);border-radius:3px;padding:1px 6px;font-size:11px;margin:2px 3px 0 0}
.grid2{display:flex;flex-wrap:wrap;padding:0 6px}
.tile{position:relative;width:calc(50% - 12px);margin:6px;background:var(--card);border:var(--bd);border-radius:10px;padding:15px 12px;cursor:pointer}
.ctag{position:absolute;top:0;right:0;background:rgba(212,175,55,.18);color:var(--gl);font-size:11px;padding:3px 8px;border-radius:0 10px 0 8px}
.icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px;border:1px solid rgba(245,215,122,.6)}
.tile .h{font-size:17px;font-weight:700;margin-bottom:3px}
.cards3{display:flex;flex-wrap:wrap;justify-content:space-between}
.cc{width:31.5%;background:var(--card2);border:var(--bd);border-radius:8px;padding:11px 4px;margin-bottom:9px;text-align:center;cursor:pointer}
.logo{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;border:1px solid var(--gold);margin:0 auto;flex:none}
.cn{font-size:13px;font-weight:700;margin:7px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{margin:5px 0 7px;font-size:10px;color:var(--t3)}
.hs{display:flex;overflow-x:auto;gap:10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.gift{flex:none;width:110px;cursor:pointer}.gift img,.pimg{width:110px;height:110px;border-radius:6px;object-fit:cover;background:#222;display:block}
.gn{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:30px;font-weight:700;color:var(--gl)}
.input{display:block;width:100%;background:var(--card2);border:var(--bd);color:var(--t);border-radius:6px;padding:10px;margin:8px 0;font:inherit;outline:none}
.input::placeholder{color:#666}
.prof{display:flex;align-items:center}
.avatar{width:65px;height:65px;border-radius:50%;background:var(--grad);color:#1a1200;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:13px;border:2px solid #000;box-shadow:0 0 0 1px var(--gold)}
.nick{font-size:20px;font-weight:700;color:var(--gl);margin-bottom:4px}
.stats{display:flex;margin-top:18px;background:var(--card);border:var(--bd);border-radius:10px;padding:13px 0}
.stat{flex:1;text-align:center;cursor:pointer}.stat .n{font-size:22px;font-weight:700;color:var(--gl)}
.menu{padding:0 14px}.menu .row{padding:16px 0;font-size:15px}.menu .mi{margin-right:10px}
.btns{display:flex;padding:0 12px;gap:10px}.btns .btn{flex:1;background:var(--card);padding:12px}
.empty{text-align:center;color:var(--t3);padding:20px 0}
.status{color:var(--gold);font-size:12px}
.side{width:95px;background:#111;border-right:var(--bd);flex:none;overflow-y:auto}
.si{padding:15px 8px;text-align:center;color:var(--t2);font-size:13px;cursor:pointer}.si.on{color:var(--gold);background:var(--bg);border-left:3px solid var(--gold);font-weight:700}
.item{display:flex;align-items:center;gap:10px;margin:8px 10px;padding:10px}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(20,20,20,.95);border:var(--bd);color:var(--gl);padding:12px 20px;border-radius:8px;font-size:14px;z-index:99;display:none;max-width:70%;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:98}
#modal .box{background:var(--card);border:var(--bd);border-radius:12px;width:280px;padding:20px;text-align:center}
#modal .acts{display:flex;gap:10px;margin-top:16px}#modal .acts .btn{flex:1}
</style></head><body><div id="app">

<div class="page" id="page"></div>
<div class="tabbar" id="tabbar"></div>

 <div class="stats"><div class="stat" onclick="go('wallet')"><div class="n">${f2(S.wallet)}</div><div class="muted">佣金钱包</div></div><div class="stat" onclick="go('points')"><div class="n">${S.points}</div><div class="muted">积分</div></div><div class="stat" onclick="go('apps')"><div class="n">${S.apps.length}</div><div class="muted">办卡记录</div></div></div></div>
 <div class="card menu">${[['💰','我的钱包（提现）','wallet'],['💳','我的办卡申请','apps'],['📦','我的礼品订单','orders'],['⭐','我的积分兑换','reds'],['📋','我的任务','mytasks'],['➕','发布任务','publish']].map(m=>`<div class="row" onclick="go('${m[2]}')"><div><span class="mi">${m[0]}</span>${m[1]}</div><span class="arrow">›</span></div>`).join('')}</div>
 <div class="card"><div class="ct">温馨提示</div>${['信用卡佣金、任务赏金均可提现到微信零钱','积分兑换需联系客服完成线下对接','发布任务需人工审核，审核通过后上线','仅限直接推荐奖励，无多级分销'].map(x=>`<div class="muted" style="margin-top:6px;font-size:13px">· ${x}</div>`).join('')}</div>
 <div class="btns"><button class="btn btn-ghost" onclick="bindPhone()">绑定手机号</button><button class="btn btn-ghost" style="color:var(--red);border-color:rgba(255,90,79,.5)" onclick="confirmBox('确定退出登录？',()=>toast('已退出（演示）'))">退出登录</button></div>`}),
cards:()=>({title:'信用卡推广',html:cards.map(c=>`<div class="card" style="display:flex;align-items:center;gap:10px"><div class="logo" style="margin:0;background:${c.lc}">${c.lt}</div><div style="flex:1"><div class="ct" style="font-size:15px">${c.name}</div><div class="muted">${c.bank} · 线上申请 · 免费办理</div><span class="tag">${c.stage} ¥${c.reward}</span></div><button class="btn btn-gold mini" onclick="go('apply:${c.id}')">申请</button></div>`).join('')}),
apply:id=>{const c=cards.find(x=>x.id==id)||cards[0];return{title:'办卡申请',html:`<div class="card"><div class="ct">办卡申请</div><select class="input" id="acard">${cards.map(x=>`<option value="${x.id}" ${x.id==c.id?'selected':''}>${x.name}（${x.stage} 奖励${x.reward}）</option>`).join('')}</select>
 <input class="input" id="aname" placeholder="真实姓名"><input class="input" id="aphone" placeholder="手机号" maxlength="11" inputmode="numeric"><label class="sub"><input type="checkbox" id="aagree" style="accent-color:#d4af37"> 我已阅读并同意《个人信息授权书》</label>
 <button class="btn btn-gold block" onclick="submitApp()">提交申请</button></div><div class="card muted">提交后请按提示前往银行官方页面完成申请；审核进度可在「我的办卡申请」查看。</div>`}},
apps:()=>({title:'我的办卡申请',html:`<div class="card">${S.apps.map(a=>`<div class="row"><div><div>${a.card}</div><div class="muted">${a.name} · ${a.t}</div></div><span class="status">已提交</span></div>`).join('')||'<div class="empty">暂无办卡记录</div>'}</div>`}),
mall:()=>({title:'礼品商城',html:`<div class="grid2">${prods.map(p=>`<div class="card" style="width:calc(50% - 12px);margin:6px;padding:8px;cursor:pointer" onclick="go('product:${p.id}')"><img src="${p.img}" style="width:100%;height:150px;object-fit:cover;border-radius:6px"><div style="margin-top:5px;font-weight:700">${p.name}</div><div class="muted">${p.cat} · 厂家直发</div><div class="red">¥${f2(p.price)}</div></div>`).join('')}</div>`}),
product:id=>{const p=prods.find(x=>x.id==id);return{title:'商品详情',html:`<img src="${p.img}" style="width:100%;aspect-ratio:1;object-fit:cover;display:block"><div class="card"><div class="red" style="font-size:24px;font-weight:700">¥${f2(p.price)}</div><div class="ct">${p.name}</div><div class="muted">厂家直发 · 快递可查</div></div>
 <div class="card"><div class="ct">收货信息</div><input class="input" id="or" placeholder="收货人"><input class="input" id="op" placeholder="手机号" inputmode="numeric"><input class="input" id="oa" placeholder="详细地址"><button class="btn btn-gold block" onclick="buy(${p.id})">微信支付 ¥${f2(p.price)}</button></div>`}},
orders:()=>({title:'我的礼品订单',html:S.orders.map(o=>`<div class="card"><div class="row"><span>${o.name} ×1</span><span class="status">${o.st}</span></div><div class="muted">金额 ¥${f2(o.price)} · ${o.t}</div>${o.no?`<div class="sub">快递：${o.no}</div>`:''}</div>`).join('')||'<div class="empty">暂无订单</div>'}),
tasks:()=>({title:'任务大厅',html:`<div class="card"><div class="sh"><span class="ct">任务大厅</span><button class="btn btn-gold mini" onclick="go('publish')">发布任务</button></div>${tasks.filter(t=>t.live!==false).map(taskRow).join('')}</div><div class="card muted">任务均经人工审核上线，赏金由发布者预付托管，完成验收后自动入账佣金钱包。</div>`}),
task:id=>{const t=tasks.find(x=>x.id==id),a=S.accepted[id];return{title:'任务详情',html:`<div class="card"><div class="ct">${t.title}</div><div class="red" style="font-size:22px;font-weight:700">¥${f2(t.reward)}</div><div class="muted">已接 ${t.taken}/${t.quota} 人</div><div class="sub" style="margin-top:8px">${t.desc}</div></div>
 <div class="card">${!a?`<button class="btn btn-gold block" style="margin:0" onclick="acceptTask(${id})">立即接单</button>`:a=='accepted'?`<div class="sub">我的状态：<span class="status">进行中</span></div><textarea class="input" id="proof" rows="3" placeholder="填写完成凭证（截图链接/说明）"></textarea><button class="btn btn-gold block" onclick="submitProof(${id})">提交凭证</button>`:`<div class="sub">我的状态：<span class="status">${a=='submitted'?'待验收':'已通过·赏金已入账'}</span></div>${a=='submitted'?'<button class="btn btn-ghost block" onclick="simApprove('+id+')">（演示）模拟发布者验收通过</button>':''}`}</div>`}},
publish:()=>({title:'发布任务',html:`<div class="card"><div class="ct">发布任务</div><input class="input" id="tt" placeholder="任务标题"><textarea class="input" id="td" rows="3" placeholder="任务要求 / 验收标准"></textarea><input class="input" id="tr" placeholder="单人赏金(元，≥1)" inputmode="decimal" oninput="calc()"><input class="input" id="tq" placeholder="名额(人)" inputmode="numeric" oninput="calc()">
 <div class="sub">需预付托管：<span class="goldt" id="tot">¥0.00</span></div><button class="btn btn-gold block" onclick="publish()">支付托管并提交审核</button></div><div class="card muted">赏金由平台托管，审核未通过将原路退回；接单人完成并经您或平台验收后，赏金入账其佣金钱包。禁止发布拉人头/多级分销类任务。</div>`}),
mytasks:()=>({title:'我的任务',html:`<div class="card"><div class="ct">我发布的</div>${S.myTasks.map(t=>`<div class="row"><div><div>${t.title}</div><div class="muted">¥${f2(t.reward)} × ${t.quota}</div></div><span class="status">人工审核中</span></div>`).join('')||'<div class="empty">暂无</div>'}</div>
 <div class="card"><div class="ct">我接的</div>${Object.entries(S.accepted).map(([id,s])=>{const t=tasks.find(x=>x.id==id);return`<div class="row" onclick="go('task:${id}')"><div><div>${t.title}</div><div class="muted">¥${f2(t.reward)}</div></div><span class="status">${{accepted:'进行中',submitted:'待验收',approved:'已入账'}[s]}</span></div>`}).join('')||'<div class="empty">暂无</div>'}</div>`}),
wallet:()=>({title:'我的钱包',html:`<div class="header"><div class="sub">可提现余额（元）</div><div class="big">${f2(S.wallet)}</div><div class="muted">信用卡佣金 + 任务赏金</div></div>
 <div class="card"><div class="ct">提现到微信零钱</div><input class="input" id="wa" placeholder="提现金额(元)，最低 10 元" inputmode="decimal"><button class="btn btn-gold block" onclick="withdraw()">申请提现</button><div class="muted" style="margin-top:6px">提现需人工审核，通常 1-3 个工作日到账</div></div>
 <div class="card"><div class="ct">收入明细</div>${S.income.map(i=>`<div class="row"><div><div>${i.t}</div><div class="muted">${i.at}</div></div><span class="goldt">+${f2(i.a)}</span></div>`).join('')||'<div class="empty">暂无收入，快去推广或接任务吧</div>'}</div>
 <div class="card"><div class="ct">提现记录</div>${S.wd.map(w=>`<div class="row"><div><div>${f2(w.a)} 元</div><div class="muted">${w.t}</div></div><span class="status">待审核</span></div>`).join('')||'<div class="empty">暂无记录</div>'}</div>`}),
points:()=>({title:'我的积分',html:`<div class="header"><div class="sub">积分余额</div><div class="big">${S.points}</div></div><div class="card"><div class="ct">积分明细</div>${S.ptsLog.map(l=>`<div class="row"><div><div>${l.r}</div><div class="muted">${l.t}</div></div><span class="${l.d>0?'goldt':'red'}">${l.d>0?'+':''}${l.d}</span></div>`).join('')}</div>`}),
reds:()=>({title:'我的积分兑换',html:`<div class="card">${S.reds.map(r=>`<div class="row"><div><div>${r.name}</div><div class="muted">-${r.cost} 积分 · ${r.t}</div></div><span class="status">待客服对接</span></div>`).join('')||'<div class="empty">暂无兑换记录</div>'}</div>`}),
};
function bindPhone(){if(S.phone)return toast('已绑定 '+S.phone);S.phone='138****6688';toast('绑定成功');render()}
function submitApp(){const n=$('#aname').value.trim(),p=$('#aphone').value.trim();if(!$('#aagree').checked)return toast('请先同意授权书');if(!n||!/^1\d{10}$/.test(p))return toast('请填写正确信息');const c=cards.find(x=>x.id==$('#acard').value);S.apps.unshift({card:c.name,name:n,t:now()});toast('提交成功');setTimeout(()=>{stack.pop();go('apps')},700)}
function buy(id){const p=prods.find(x=>x.id==id);if(!$('#or').value||!$('#op').value||!$('#oa').value)return toast('请填写收货信息');confirmBox(`微信支付（模拟）¥${f2(p.price)}`,()=>{S.orders.unshift({name:p.name,price:p.price,st:'待发货',t:now()});toast('支付成功');setTimeout(()=>{stack.pop();go('orders')},700)})}
function redeem(id){const it=items.find(x=>x.id==id);confirmBox(`使用 ${it.cost} 积分兑换「${it.name}」？`,()=>{if(S.points<it.cost)return toast('积分不足');S.points-=it.cost;S.ptsLog.unshift({r:'积分兑换·'+it.name,d:-it.cost,t:now()});S.reds.unshift({name:it.name,cost:it.cost,t:now()});toast('兑换成功，客服将联系您');render()})}
function acceptTask(id){const t=tasks.find(x=>x.id==id);if(t.taken>=t.quota)return toast('名额已满');t.taken++;S.accepted[id]='accepted';toast('接单成功');render()}
function submitProof(id){if(!$('#proof').value.trim())return toast('请填写凭证');S.accepted[id]='submitted';toast('已提交，等待验收');render()}
function simApprove(id){const t=tasks.find(x=>x.id==id);S.accepted[id]='approved';S.wallet+=t.reward;S.income.unshift({t:'任务赏金·'+t.title,a:t.reward,at:now()});toast(`验收通过，¥${f2(t.reward)} 已入账`);render()}
function calc(){$('#tot').textContent='¥'+f2((+$('#tr').value||0)*(+$('#tq').value||0))}
function publish(){const t=$('#tt').value.trim(),r=+$('#tr').value,q=+$('#tq').value;if(!t||!(r>=1)||!(q>=1))return toast('请填写完整（赏金≥1元）');confirmBox(`预付托管 ¥${f2(r*q)}（模拟微信支付）`,()=>{S.myTasks.unshift({title:t,reward:r,quota:q});toast('已支付，等待人工审核');setTimeout(()=>{stack.pop();go('mytasks')},700)})}
function withdraw(){const a=+$('#wa').value;if(!(a>=10))return toast('最低提现 10 元');if(a>S.wallet)return toast('可提现余额不足');S.wallet-=a;S.wd.unshift({a,t:now()});toast('已提交审核');render()}
const h=decodeURIComponent(location.hash.slice(1));stack=h&&PAGES[h.split(':')[0]]?(TABS.some(t=>t[0]===h.split(':')[0])?[h]:['home',h]):['home'];render();
</script></body></html>
